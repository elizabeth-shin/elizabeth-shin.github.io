<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARISE Framework | Elizabeth Shin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>

    :root {
      --navy:       #0D1B2A;
      --slate:      #1B3A5C;
      --gold:       #C9A84C;
      --gold-light: #F0D990;
      --warm-white: #F8F6F1;
      --mid-gray:   #6B7280;
      --light-gray: #E5E7EB;
      --red:        #991B1B;
      --green:      #065F46;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif !important;
      background: var(--navy);
      color: var(--warm-white);
      overflow-x: hidden;
    }

    h1, h2, h3,
    .section-title, .arise-word, .download-title,
    .nav-brand, .hero h1, .hero-quote {
      font-family: 'DM Serif Display', serif !important;
    }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── GOLD LEFT SPINE ── */
    body::after {
      content: '';
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: var(--gold);
      z-index: 100;
    }

    main { position: relative; z-index: 1; }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      background: rgba(13, 27, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 14px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      color: var(--warm-white);
      text-decoration: none;
    }

    .nav-brand span { color: var(--gold); }

    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a {
      color: var(--mid-gray);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }

    /* ── HERO ── */
    .hero {
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 48px 60px;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    .hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero-rule {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin-bottom: 28px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      position: relative;
    }

    .hero h1 .watermark {
      position: absolute;
      font-size: clamp(8rem, 20vw, 18rem);
      color: rgba(255,255,255,0.03);
      top: -40px;
      left: -20px;
      pointer-events: none;
      user-select: none;
      line-height: 1;
    }

    .hero-sub {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      color: rgba(248, 246, 241, 0.6);
      font-weight: 300;
      margin-bottom: 36px;
      max-width: 560px;
    }

    .hero-quote {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--gold);
      padding-left: 20px;
      border-left: 2px solid var(--gold);
      margin-bottom: 48px;
      max-width: 480px;
    }

    .btn-group { display: flex; gap: 14px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-gold {
      background: var(--gold);
      color: var(--navy);
      border: 2px solid var(--gold);
    }
    .btn-gold:hover { background: var(--gold-light); border-color: var(--gold-light); transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--warm-white);
      border: 2px solid rgba(248,246,241,0.25);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }

    /* ── SECTION ── */
    section {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 48px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .section-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
      margin-bottom: 36px;
    }

    .section-body {
      font-size: 1rem;
      line-height: 1.75;
      color: rgba(248,246,241,0.75);
      max-width: 680px;
      margin-bottom: 24px;
    }

    /* ── CALLOUT BOX ── */
    .callout {
      background: rgba(10, 21, 32, 0.8);
      border-left: 4px solid var(--gold);
      border-radius: 0 6px 6px 0;
      padding: 22px 28px;
      margin: 32px 0;
    }
    .callout strong {
      display: block;
      font-size: 1.05rem;
      color: var(--warm-white);
      margin-bottom: 8px;
    }
    .callout p {
      font-size: 0.92rem;
      color: var(--mid-gray);
      line-height: 1.65;
    }

    /* ── ARISE GRID ── */
    .arise-grid {
      display: grid;
      gap: 2px;
      margin-top: 36px;
    }

    .arise-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 0;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      transition: background 0.2s;
    }
    .arise-row:hover { background: rgba(201,168,76,0.06); }

    .arise-letter {
      font-family: 'DM Serif Display', serif;
      font-size: 3.5rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(201,168,76,0.06);
      padding: 20px;
      line-height: 1;
    }

    .arise-content {
      padding: 20px 24px;
      border-left: 1px solid rgba(255,255,255,0.06);
    }

    .arise-word {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      color: var(--warm-white);
      margin-bottom: 6px;
    }

    .arise-desc {
      font-size: 0.88rem;
      color: var(--mid-gray);
      line-height: 1.6;
    }

    /* ── COMPARISON TABLE ── */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 32px;
    }

    .compare-header {
      padding: 14px 18px;
      border-radius: 6px 6px 0 0;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
    }
    .compare-header.red { background: var(--red); }
    .compare-header.green { background: var(--green); }

    .compare-col {
      display: flex;
      flex-direction: column;
    }

    .compare-item {
      padding: 12px 18px;
      font-size: 0.88rem;
      line-height: 1.5;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .compare-item.red-bg { background: rgba(153,27,27,0.12); color: #FCA5A5; }
    .compare-item.green-bg { background: rgba(6,95,70,0.12); color: #6EE7B7; }
